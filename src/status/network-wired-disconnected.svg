  <!-- Top Contact Pins -->
  <rect x="62" y="38" width="16" height="34" rx="4" fill="#94A3B8" stroke="#171717" stroke-width="7"/>
  <rect x="92" y="38" width="16" height="34" rx="4" fill="#94A3B8" stroke="#171717" stroke-width="7"/>
