<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Audacity Blue Headband Gradient -->
    <linearGradient id="aud_blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F7DF3"/>
      <stop offset="100%" stop-color="#244BBF"/>
    </linearGradient>
    <!-- Audacity Earcup Light Blue -->
    <linearGradient id="aud_cup" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#65C7FF"/>
      <stop offset="100%" stop-color="#2889E6"/>
    </linearGradient>
    <!-- Wave Yellow/Orange Gradient -->
    <linearGradient id="aud_wave_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE477"/>
      <stop offset="100%" stop-color="#FFAA6B"/>
    </linearGradient>
  </defs>

  <!-- Wave backdrop in center -->
  <g transform="translate(128, 148) scale(3.6)">
    <path d="m 0, -14 c -1.4,-0.035 -2.68,0.635 -3.543,1.672 -0.413,-0.208 -0.774,-0.567 -1.209,-0.629 -1.822,-0.259 -4.034,0.818 -4.818,2.803 l -1.961,4.963 c -0.337,-0.04 -0.675,-0.141 -0.998,-0.1 -1.194,0.153 -2.156,0.751 -2.84,1.537 -0.684,0.786 -1.145,1.821 -1.133,3.025 0.012,1.204 0.627,2.503 1.57,3.324 l 2.637,2.295 c 1.063,0.925 2.448,1.164 3.738,0.926 l 0.01,0.102 c 0.211,2.217 2.214,3.9 4.111,4.057 0.847,0.07 1.742,-0.248 2.549,-0.713 0.389,2.171 2.478,3.713 4.369,3.73 1.929,0.018 4.115,-1.536 4.482,-3.77 l 0.057,-0.344 c 1.542,0.265 3.332,-0.29 4.381,-1.695 l 3.955,-5.295 c 0.748,-1.002 1.074,-2.401 0.832,-3.58 -0.242,-1.179 -0.911,-2.095 -1.746,-2.719 -0.835,-0.623 -1.902,-1.003 -3.102,-0.9 -0.346,0.03 -0.679,0.205 -1.02,0.328 l -0.768,-3.492 c -0.474,-2.155 -2.624,-3.581 -4.514,-3.531 -0.404,0.011 -0.766,0.327 -1.168,0.465 -0.739,-1.43 -2.204,-2.423 -3.873,-2.465 z" fill="url(#aud_wave_bg)" stroke="#171717" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Sharp red wave line in center -->
    <path d="M -12, -0.8 L -9.3, 1.5 L -5.3, -8.5 L -4, 5.5 L 0, -9.5 L 2.6, 8.5 L 5.3, -7.5 L 8, 4.5 L 12, -0.8" fill="none" stroke="#FF4D4D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Headphone Arch (Outer) -->
  <path d="M 128 26 C 73 26 28 71 28 126 L 28 178 L 52 178 L 52 126 C 52 84 86 50 128 50 C 170 50 204 84 204 126 L 204 178 L 228 178 L 228 126 C 228 71 183 26 128 26 Z" fill="url(#aud_blue)" stroke="#171717" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Left Earcup -->
  <g transform="translate(42, 164)">
    <rect x="-24" y="-38" width="48" height="76" rx="24" fill="url(#aud_blue)" stroke="#171717" stroke-width="13" stroke-linejoin="round"/>
    <rect x="0" y="-30" width="18" height="60" rx="9" fill="url(#aud_cup)" stroke="#171717" stroke-width="9" stroke-linejoin="round"/>
  </g>

  <!-- Right Earcup -->
  <g transform="translate(214, 164)">
    <rect x="-24" y="-38" width="48" height="76" rx="24" fill="url(#aud_blue)" stroke="#171717" stroke-width="13" stroke-linejoin="round"/>
    <rect x="-18" y="-30" width="18" height="60" rx="9" fill="url(#aud_cup)" stroke="#171717" stroke-width="9" stroke-linejoin="round"/>
  </g>
</svg>
