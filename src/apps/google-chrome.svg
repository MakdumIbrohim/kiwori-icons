<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Chromium Top Blade (Vibrant Blue) -->
    <linearGradient id="ch_top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B96FF"/>
      <stop offset="100%" stop-color="#2572E8"/>
    </linearGradient>
    <!-- Chromium Right Blade (Light Sky / Ice Blue) -->
    <linearGradient id="ch_right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93D3FB"/>
      <stop offset="100%" stop-color="#60B5F7"/>
    </linearGradient>
    <!-- Chromium Left Blade (Cyan / Teal Blue) -->
    <linearGradient id="ch_left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4AD6E8"/>
      <stop offset="100%" stop-color="#1BA7C4"/>
    </linearGradient>
    <!-- Center Core Deep Blue -->
    <linearGradient id="ch_core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D72E2"/>
      <stop offset="100%" stop-color="#144EB2"/>
    </linearGradient>
  </defs>

  <!-- Base Outer Circle Background (Cyan-blue base) -->
  <circle cx="128.0" cy="128.0" r="114.0" fill="url(#ch_left)"/>

  <!-- Right Segment (Light Sky / Ice Blue) -->
  <path d="M 128.00 82.00
           L 232.31 82.00
           A 114.0 114.0 0 0 1 115.68 241.33
           L 167.84 151.00
           A 46.0 46.0 0 0 0 128.00 82.00 Z"
        fill="url(#ch_right)"/>

  <!-- Top Segment (Vibrant Blue) -->
  <path d="M 88.16 151.00
           L 36.01 60.67
           A 114.0 114.0 0 0 1 232.31 82.00
           L 128.00 82.00
           A 46.0 46.0 0 0 0 88.16 151.00 Z"
        fill="url(#ch_top)"/>

  <!-- Dividing Lines with Bold Black Outlines -->
  <line x1="128.00" y1="82.00" x2="232.31" y2="82.00"
        stroke="#171717" stroke-width="13" stroke-linecap="round"/>
  <line x1="167.84" y1="151.00" x2="115.68" y2="241.33"
        stroke="#171717" stroke-width="13" stroke-linecap="round"/>
  <line x1="88.16" y1="151.00" x2="36.01" y2="60.67"
        stroke="#171717" stroke-width="13" stroke-linecap="round"/>

  <!-- Master Outer Rim Outline -->
  <circle cx="128.0" cy="128.0" r="114.0" fill="none" stroke="#171717" stroke-width="14"/>

  <!-- Center Core Circle with Bold Outline -->
  <circle cx="128.0" cy="128.0" r="46.0" fill="url(#ch_core)" stroke="#171717" stroke-width="13"/>

  <!-- Center Core Highlight Reflection -->
  <circle cx="114" cy="114" r="6.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="138" cy="138" r="3" fill="#FFFFFF" opacity="0.6"/>
</svg>