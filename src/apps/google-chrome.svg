<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Vibrant Kiwori pastel segment gradients matching the user's reference -->
    <!-- Red/Pink Segment (Top) -->
    <linearGradient id="cr_red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D79"/>
      <stop offset="100%" stop-color="#FF2458"/>
    </linearGradient>
    <!-- Yellow Segment (Right) -->
    <linearGradient id="cr_yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE477"/>
      <stop offset="100%" stop-color="#FFC83B"/>
    </linearGradient>
    <!-- Cyan/Green Segment (Left) -->
    <linearGradient id="cr_green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ED8D2"/>
      <stop offset="100%" stop-color="#24BDA8"/>
    </linearGradient>
    <!-- Center Core Blue -->
    <linearGradient id="cr_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FA8FF"/>
      <stop offset="100%" stop-color="#2280F2"/>
    </linearGradient>
  </defs>

  <!-- Base Outer Circle Background (Green base) -->
  <circle cx="128.0" cy="128.0" r="114.0" fill="url(#cr_green)"/>

  <!-- Yellow Segment (Right & Bottom-Right) -->
  <path d="M 128.00 82.00
           L 232.31 82.00
           A 114.0 114.0 0 0 1 115.68 241.33
           L 167.84 151.00
           A 46.0 46.0 0 0 0 128.00 82.00 Z"
        fill="url(#cr_yellow)"/>

  <!-- Red Segment (Top) -->
  <path d="M 88.16 151.00
           L 36.01 60.67
           A 114.0 114.0 0 0 1 232.31 82.00
           L 128.00 82.00
           A 46.0 46.0 0 0 0 88.16 151.00 Z"
        fill="url(#cr_red)"/>

  <!-- Dividing Lines with Bold Black Outlines -->
  <line x1="128.00" y1="82.00" x2="232.31" y2="82.00"
        stroke="#171717" stroke-width="13" stroke-linecap="round"/>
  <line x1="167.84" y1="151.00" x2="115.68" y2="241.33"
        stroke="#171717" stroke-width="13" stroke-linecap="round"/>
  <line x1="88.16" y1="151.00" x2="36.01" y2="60.67"
        stroke="#171717" stroke-width="13" stroke-linecap="round"/>

  <!-- Master Outer Rim Outline -->
  <circle cx="128.0" cy="128.0" r="114.0" fill="none" stroke="#171717" stroke-width="14"/>

  <!-- Center Core Blue Circle with Bold Outline -->
  <circle cx="128.0" cy="128.0" r="46.0" fill="url(#cr_blue)" stroke="#171717" stroke-width="13"/>

  <!-- Center Core Highlight Reflection -->
  <circle cx="114" cy="114" r="6.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="138" cy="138" r="3" fill="#FFFFFF" opacity="0.6"/>

  <!-- Cartoon Highlight Curve on Outer Badge Top-Left -->
  <path d="M 44 94 C 52 60, 80 34, 114 26" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
</svg>