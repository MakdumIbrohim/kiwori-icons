<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Paper Sheet Gradient -->
    <linearGradient id="lo_sheet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F5FA"/>
    </linearGradient>
    <!-- Dog-ear Fold Gradient -->
    <linearGradient id="lo_fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D0D9E6"/>
      <stop offset="100%" stop-color="#A8B7CC"/>
    </linearGradient>
    <!-- Charcoal Frame Gradient -->
    <linearGradient id="lo_charcoal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B3F4D"/>
      <stop offset="100%" stop-color="#21242D"/>
    </linearGradient>
  </defs>

  <!-- Document Sheet -->
  <g transform="translate(26, 24) scale(8.5)">
    <!-- Base Charcoal Border Frame -->
    <path d="M 2.661 0 a 0.59 0.59 0 0 0 -0.582 0.59 v 22.82 a 0.59 0.59 0 0 0 0.582 0.59 h 18.67 a 0.59 0.59 0 0 0 0.59 -0.59 V 8.716 a 0.59 0.59 0 0 0 -0.17 -0.42 L 13.674 0.182 a 0.59 0.59 0 0 0 -0.42 -0.181 z" fill="url(#lo_charcoal)" stroke="#171717" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Inner Paper Body -->
    <path d="M 3.251 1.184 h 9.754 l 7.733 7.77 v 13.863 H 3.251 z" fill="url(#lo_sheet)" stroke="#171717" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Dog-ear fold top-right -->
    <path d="M 16.365 0 a 0.597 0.597 0 0 0 -0.555 0.352 a 0.582 0.582 0 0 0 0.128 0.635 l 4.985 4.996 a 0.605 0.605 0 0 0 0.635 0.133 a 0.59 0.59 0 0 0 0.363 -0.53 V 0.577 A 0.605 0.605 0 0 0 21.335 0 z" fill="url(#lo_fold)" stroke="#171717" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- 4 Suite Tiles (Writer, Calc, Impress, Draw) in Center -->
  <g transform="translate(112, 142)">
    <!-- Writer Blue (top left) -->
    <rect x="-32" y="-32" width="28" height="28" rx="7" fill="#4FA8FF" stroke="#171717" stroke-width="8"/>
    <!-- Calc Green (top right) -->
    <rect x="4" y="-32" width="28" height="28" rx="7" fill="#73D69A" stroke="#171717" stroke-width="8"/>
    <!-- Impress Orange (bottom left) -->
    <rect x="-32" y="4" width="28" height="28" rx="7" fill="#FFAA6B" stroke="#171717" stroke-width="8"/>
    <!-- Draw Yellow (bottom right) -->
    <rect x="4" y="4" width="28" height="28" rx="7" fill="#FFE477" stroke="#171717" stroke-width="8"/>
  </g>
</svg>
