<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Front Folder Manila Gold Gradient -->
    <linearGradient id="folder_flap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFBD4A"/>
      <stop offset="100%" stop-color="#FFA026"/>
    </linearGradient>
    <!-- Rear System Folder Cyan-Teal Gradient -->
    <linearGradient id="back_flap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5ED8D2"/>
      <stop offset="100%" stop-color="#1BAAA2"/>
    </linearGradient>
  </defs>

  <!-- 1. Rear Cascading Folder (Offset top-right, cyan/blue system folder) -->
  <g transform="translate(18, -16)">
    <!-- Back Tab -->
    <path d="M 56 34 L 116 34 C 128 34, 138 42, 146 54 L 152 62 C 158 70, 166 74, 176 74 L 210 74 C 224 74, 232 82, 232 96 L 232 200 L 40 200 Z"
          fill="#16807A" stroke="#171717" stroke-width="12" stroke-linejoin="round"/>
    <!-- Rear Front Flap -->
    <path d="M 28 94 C 28 80, 42 70, 56 70 L 112 70 C 124 70, 134 78, 142 88 L 148 94 C 154 100, 162 104, 172 104 L 222 104 C 234 104, 240 112, 240 124 L 240 210 L 28 210 Z"
          fill="url(#back_flap)" stroke="#171717" stroke-width="12" stroke-linejoin="round"/>
  </g>

  <!-- 2. Main Manila Yellow Front Folder -->
  <!-- Back Folder Tab & Base -->
  <path d="M 22 50
           C 22 28, 36 14, 56 14
           L 106 14
           C 118 14, 128 22, 136 34
           L 142 42
           C 148 50, 156 54, 166 54
           L 220 54
           C 234 54, 242 62, 242 76
           L 242 222
           C 242 236, 232 246, 218 246
           L 38 246
           C 24 246, 14 236, 14 222
           L 14 74
           C 14 62, 18 52, 22 50 Z"
        fill="#E58A20" stroke="#171717" stroke-width="13" stroke-linejoin="round"/>

  <!-- White Paper Peeking Out -->
  <path d="M 34 58
           C 34 42, 46 32, 60 32
           L 196 32
           C 210 32, 222 42, 222 56
           L 222 116
           L 34 116 Z"
        fill="#FFFFFF" stroke="#171717" stroke-width="11" stroke-linejoin="round"/>
  <path d="M 58 56 L 118 56" stroke="#D0D7DE" stroke-width="7" stroke-linecap="round"/>
  <path d="M 58 76 L 168 76" stroke="#D0D7DE" stroke-width="7" stroke-linecap="round"/>

  <!-- Front Folder Pocket -->
  <path d="M 12 104
           C 12 88, 26 78, 42 78
           L 102 78
           C 114 78, 124 86, 132 96
           L 138 102
           C 144 108, 152 112, 162 112
           L 222 112
           C 236 112, 244 120, 244 134
           L 244 224
           C 244 238, 234 246, 220 246
           L 36 246
           C 22 246, 12 238, 12 224 Z"
        fill="url(#folder_flap)" stroke="#171717" stroke-width="13" stroke-linejoin="round"/>
</svg>
