<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 1. Master Page Base Sheet -->
  <path d="M 52 14
           L 184 14
           L 222 52
           L 222 222
           C 222 234, 212 242, 198 242
           L 58 242
           C 44 242, 34 234, 34 222
           L 34 34
           C 34 20, 44 14, 52 14 Z"
        fill="#FFFFFF" stroke="#171717" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 2. Compact Folded Top-Right Corner -->
  <path d="M 184 14 L 184 52 L 222 52 Z" fill="#E4E9F0" stroke="#171717" stroke-width="11" stroke-linejoin="round"/>

  <!-- 3. Bottom Color Accent Bar -->
  <path d="M 34 180 L 34 222 C 34 234, 44 242, 58 242 L 198 242 C 212 242, 222 234, 222 222 L 222 180 Z"
        fill="#65C7FF" stroke="#171717" stroke-width="11" stroke-linejoin="round"/>

  <!-- 4. Center Emblem -->
    <!-- Internet Globe & Web Link -->
  <g transform="translate(128, 118)">
    <!-- Globe Circle -->
    <circle cx="0" cy="0" r="38" fill="#65C7FF" stroke="#171717" stroke-width="9"/>
    <!-- Latitude Line -->
    <ellipse cx="0" cy="0" rx="38" ry="14" fill="none" stroke="#171717" stroke-width="7"/>
    <!-- Longitude Arc -->
    <ellipse cx="0" cy="0" rx="16" ry="38" fill="none" stroke="#171717" stroke-width="7"/>
    <line x1="0" y1="-38" x2="0" y2="38" stroke="#171717" stroke-width="7"/>
    <!-- Link badge icon on bottom-right -->
    <circle cx="24" cy="24" r="14" fill="#FFE477" stroke="#171717" stroke-width="6"/>
    <!-- Link chain stroke inside badge -->
    <path d="M 19 29 L 29 19" stroke="#171717" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>