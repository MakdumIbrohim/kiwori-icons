<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="usb_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ED8D2"/>
      <stop offset="100%" stop-color="#22AAA2"/>
    </linearGradient>
    <linearGradient id="usb_plug" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Metal USB Plug (Top) -->
  <rect x="88" y="16" width="80" height="66" rx="8" fill="url(#usb_plug)" stroke="#171717" stroke-width="13" stroke-linejoin="round"/>
  <!-- USB Plug Holes -->
  <rect x="104" y="32" width="16" height="18" rx="3" fill="#20242E" stroke="#171717" stroke-width="5"/>
  <rect x="136" y="32" width="16" height="18" rx="3" fill="#20242E" stroke="#171717" stroke-width="5"/>

  <!-- Main Flash Drive Body -->
  <rect x="58" y="70" width="140" height="152" rx="36" fill="url(#usb_body)" stroke="#171717" stroke-width="14" stroke-linejoin="round"/>

  <!-- Grip Indent / Stripe on body -->
  <path d="M 82 120 L 174 120" stroke="#171717" stroke-width="9" stroke-linecap="round"/>
  <path d="M 82 142 L 174 142" stroke="#171717" stroke-width="9" stroke-linecap="round"/>

  <!-- Body Highlight -->
  <path d="M 78 86 C 84 78, 96 78, 110 78" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- Lanyard Loop (Bottom) -->
  <path d="M 104 222 L 104 238 C 104 246, 114 250, 128 250 C 142 250, 152 246, 152 238 L 152 222" fill="none" stroke="#171717" stroke-width="13" stroke-linejoin="round"/>
  <!-- Status Activity LED -->
  <circle cx="128" cy="182" r="9" fill="#FFE477" stroke="#171717" stroke-width="5"/>
</svg>