<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Dark modern navy background -->
    <linearGradient id="win_body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262838"/>
      <stop offset="100%" stop-color="#161822"/>
    </linearGradient>
    <linearGradient id="header_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3E54"/>
      <stop offset="100%" stop-color="#2D3042"/>
    </linearGradient>
  </defs>

  <!-- 1. Main Terminal Window Container -->
  <rect x="12" y="20" width="232" height="216" rx="42" fill="url(#win_body)" stroke="#171717" stroke-width="14" stroke-linejoin="round"/>

  <!-- 2. Window Titlebar Header -->
  <path d="M 12 68
           L 12 62
           C 12 38, 26 20, 54 20
           L 202 20
           C 230 20, 244 38, 244 62
           L 244 68 Z"
        fill="url(#header_grad)" stroke="#171717" stroke-width="14" stroke-linejoin="round"/>
  <!-- Header divider line -->
  <line x1="12" y1="68" x2="244" y2="68" stroke="#171717" stroke-width="10"/>

  <!-- 3. Traffic Light Candy Buttons -->
  <circle cx="44" cy="44" r="9.5" fill="#FF6B6B" stroke="#171717" stroke-width="5.5"/>
  <circle cx="72" cy="44" r="9.5" fill="#FFE477" stroke="#171717" stroke-width="5.5"/>
  <circle cx="100" cy="44" r="9.5" fill="#73D69A" stroke="#171717" stroke-width="5.5"/>

  <!-- Active Tab in Header -->
  <path d="M 132 68 L 140 38 C 142 32, 148 30, 154 30 L 208 30 C 214 30, 220 32, 222 38 L 230 68 Z"
        fill="#262838" stroke="#171717" stroke-width="9" stroke-linejoin="round"/>
  <!-- Tab title dot -->
  <circle cx="181" cy="48" r="4.5" fill="#5ED8D2"/>

  <!-- 4. Top Header Highlight Curve -->
  <path d="M 44 30 L 212 30" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.35"/>

  <!-- 5. Command Prompt: Chunky Neon Cyan > -->
  <path d="M 46 112 L 86 142 L 46 172" fill="none" stroke="#171717" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 46 112 L 86 142 L 46 172" fill="none" stroke="#5ED8D2" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 6. Blinking Cursor Block: Chunky Neon Yellow █ -->
  <rect x="114" y="120" width="32" height="44" rx="8" fill="#FFE477" stroke="#171717" stroke-width="10" stroke-linejoin="round"/>

  <!-- 7. Syntax Output Bars (Pink & Green code lines) -->
  <!-- Line 1: Keyword Pink -->
  <path d="M 48 196 L 112 196" stroke="#171717" stroke-width="16" stroke-linecap="round"/>
  <path d="M 48 196 L 112 196" stroke="#FF8FB1" stroke-width="10" stroke-linecap="round"/>

  <!-- Line 2: String/Param Green -->
  <path d="M 134 196 L 202 196" stroke="#171717" stroke-width="16" stroke-linecap="round"/>
  <path d="M 134 196 L 202 196" stroke="#73D69A" stroke-width="10" stroke-linecap="round"/>
</svg>