<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Clean dark charcoal squircle gradient -->
    <linearGradient id="term_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#323644"/>
      <stop offset="100%" stop-color="#1E202A"/>
    </linearGradient>
  </defs>

  <!-- 1. Dark Rounded Box -->
  <rect x="20" y="20" width="216" height="216" rx="52" fill="url(#term_bg)" stroke="#171717" stroke-width="14" stroke-linejoin="round"/>

  <!-- 2. Clean Natural White Chevron > -->
  <path d="M 64 88 L 116 128 L 64 168" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. Clean Natural Yellow Cursor _ -->
  <line x1="138" y1="168" x2="196" y2="168" stroke="#FFE477" stroke-width="20" stroke-linecap="round"/>
</svg>
