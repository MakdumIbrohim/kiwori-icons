<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="trash_can" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B8CA6"/>
      <stop offset="100%" stop-color="#556277"/>
    </linearGradient>
    <linearGradient id="lid_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8F9FB8"/>
      <stop offset="100%" stop-color="#64738B"/>
    </linearGradient>
  </defs>

  <!-- Side Handle Left -->
  <path d="M 44 116 C 30 116, 24 130, 24 142 C 24 154, 30 168, 44 168" fill="none" stroke="#171717" stroke-width="12" stroke-linecap="round"/>
  <!-- Side Handle Right -->
  <path d="M 212 116 C 226 116, 232 130, 232 142 C 232 154, 226 168, 212 168" fill="none" stroke="#171717" stroke-width="12" stroke-linecap="round"/>

  <!-- Can Body (Tapered Bucket) -->
  <path d="M 48 76
           L 68 224
           C 70 238, 82 246, 96 246
           L 160 246
           C 174 246, 186 238, 188 224
           L 208 76 Z"
        fill="url(#trash_can)" stroke="#171717" stroke-width="14" stroke-linejoin="round"/>

  <!-- Vertical Ribs Detail -->
  <line x1="88" y1="96" x2="100" y2="226" stroke="#171717" stroke-width="10" stroke-linecap="round"/>
  <line x1="128" y1="96" x2="128" y2="226" stroke="#171717" stroke-width="10" stroke-linecap="round"/>
  <line x1="168" y1="96" x2="156" y2="226" stroke="#171717" stroke-width="10" stroke-linecap="round"/>

  <!-- Rib Highlights -->
  <line x1="86" y1="102" x2="96" y2="216" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <line x1="126" y1="102" x2="126" y2="216" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.35"/>

  <!-- Lid Rim -->
  <rect x="36" y="54" width="184" height="26" rx="10" fill="url(#lid_grad)" stroke="#171717" stroke-width="13" stroke-linejoin="round"/>
  <path d="M 52 62 L 204 62" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- Lid Handle (Top) -->
  <path d="M 104 54 L 104 32 C 104 22, 114 16, 128 16 C 142 16, 152 22, 152 32 L 152 54" fill="none" stroke="#171717" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 104 54 L 104 32 C 104 22, 114 16, 128 16 C 142 16, 152 22, 152 32 L 152 54" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
</svg>